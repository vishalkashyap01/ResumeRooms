<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 80" role="img" aria-label="Decorative vine divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lf { transform-box: fill-box; transform-origin: 0% 50%; animation: flap 3.2s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    @media (prefers-reduced-motion: reduce) { .lf { animation: none !important; } }
  </style>

  <path id="vine" d="M0 40 C100 10 200 70 300 40 S500 10 600 40 S800 70 900 40 S1100 10 1200 40"
        fill="none" stroke="#5aa876" stroke-width="3" stroke-linecap="round"/>

  <g fill="#7cc08c">
    <g transform="translate(150 40) rotate(-50)"><path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-.4s"/></g>
    <g transform="translate(300 40) rotate(50)"> <path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-1.2s"/></g>
    <g transform="translate(450 40) rotate(-50)"><path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-2s"/></g>
    <g transform="translate(600 40) rotate(50)"> <path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-.8s"/></g>
    <g transform="translate(750 40) rotate(-50)"><path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-1.6s"/></g>
    <g transform="translate(900 40) rotate(50)"> <path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-2.4s"/></g>
    <g transform="translate(1050 40) rotate(-50)"><path class="lf" d="M0 0C8-12 24-12 32 0 24 12 8 12 0 0Z" style="animation-delay:-.2s"/></g>
  </g>
  <g fill="#e0b050">
    <circle cx="225" cy="52" r="4"/>
    <circle cx="675" cy="28" r="4"/>
    <circle cx="975" cy="52" r="4"/>
  </g>

  <!-- firefly -->
  <circle r="5" fill="#ffe27a">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath xlink:href="#vine"/></animateMotion>
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
