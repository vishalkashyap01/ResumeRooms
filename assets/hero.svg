<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ResumeRooms</title>
  <desc id="d">Animated forest scene: a softly glowing sun, swaying pine trees and drifting leaves above the title ResumeRooms.</desc>

  <style>
    .halo  { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite alternate; }
    .sway  { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite alternate; }
    .fall  { animation: fall 12s linear infinite; }
    .in    { animation: rise 1.6s ease-out both; }
    .draw  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s ease-out .6s forwards; }
    .cloud { animation: drift 40s linear infinite alternate; }

    @keyframes pulse { from { transform: scale(.9);  opacity: .75; } to { transform: scale(1.12); opacity: 1; } }
    @keyframes sway  { from { transform: rotate(-1.8deg); } to { transform: rotate(1.8deg); } }
    @keyframes fall {
      0%   { transform: translate(0,-40px) rotate(0deg);    opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(45px,200px) rotate(180deg); }
      90%  { opacity: .8; }
      100% { transform: translate(-25px,440px) rotate(360deg); opacity: 0; }
    }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(60px); } }

    @media (prefers-reduced-motion: reduce) {
      .halo, .sway, .fall, .in, .cloud { animation: none !important; }
      .draw { animation: none !important; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#cfeedd"/>
      <stop offset="0.65" stop-color="#eef7e4"/>
      <stop offset="1"    stop-color="#f8f3dc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 0C10-15 30-15 40 0 30 15 10 15 0 0Z"/>
      <path d="M2 0H36" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5" fill="none"/>
    </g>
    <g id="pine">
      <rect x="-5" y="35" width="10" height="25" fill="#6b4f3a"/>
      <path d="M0 -80 L30 -30 H-30 Z"/>
      <path d="M0 -55 L38 0 H-38 Z"/>
      <path d="M0 -25 L46 35 H-46 Z"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- sun -->
  <g transform="translate(1000 90)">
    <circle class="halo" r="115" fill="url(#glow)"/>
    <circle r="36" fill="#ffe27a"/>
  </g>

  <!-- soft clouds -->
  <g class="cloud" fill="#ffffff" opacity=".8">
    <ellipse cx="220" cy="80"  rx="60" ry="16"/>
    <ellipse cx="260" cy="70"  rx="40" ry="14"/>
    <ellipse cx="720" cy="55"  rx="50" ry="13"/>
    <ellipse cx="755" cy="47"  rx="32" ry="11"/>
  </g>

  <!-- hills -->
  <path d="M0 330 C200 270 380 300 560 320 S900 280 1200 320 V420 H0Z" fill="#a8d8b0"/>
  <path d="M0 360 C220 320 420 350 640 360 S1000 330 1200 355 V420 H0Z" fill="#74bb85"/>

  <!-- background pines -->
  <g transform="translate(250 324) scale(.6)"><g class="sway" style="animation-delay:-1s"><use xlink:href="#pine" fill="#4f9d68"/></g></g>
  <g transform="translate(940 322) scale(.6)"><g class="sway" style="animation-delay:-2.5s"><use xlink:href="#pine" fill="#4f9d68"/></g></g>

  <!-- front hill -->
  <path d="M0 395 C300 370 600 400 900 385 S1100 380 1200 390 V420 H0Z" fill="#3f8f5a"/>

  <!-- foreground pines -->
  <g transform="translate(90 306) scale(1.1)"><g class="sway"><use xlink:href="#pine" fill="#2b6b45"/></g></g>
  <g transform="translate(175 330) scale(.8)"><g class="sway" style="animation-delay:-2s"><use xlink:href="#pine" fill="#357a52"/></g></g>
  <g transform="translate(1110 300) scale(1.2)"><g class="sway" style="animation-delay:-1.4s"><use xlink:href="#pine" fill="#2b6b45"/></g></g>
  <g transform="translate(1020 329) scale(.85)"><g class="sway" style="animation-delay:-3s"><use xlink:href="#pine" fill="#357a52"/></g></g>

  <!-- drifting leaves -->
  <g transform="translate(120 0)">  <g class="fall" style="animation-duration:11s;animation-delay:-2s"> <use xlink:href="#leaf" fill="#7cc08c" transform="scale(.6)"/></g></g>
  <g transform="translate(300 0)">  <g class="fall" style="animation-duration:13s;animation-delay:-7s"> <use xlink:href="#leaf" fill="#a8d070" transform="scale(.5)"/></g></g>
  <g transform="translate(470 0)">  <g class="fall" style="animation-duration:12s;animation-delay:-4s"> <use xlink:href="#leaf" fill="#e0b050" transform="scale(.55)"/></g></g>
  <g transform="translate(640 0)">  <g class="fall" style="animation-duration:14s;animation-delay:-9s"> <use xlink:href="#leaf" fill="#5aa876" transform="scale(.5)"/></g></g>
  <g transform="translate(790 0)">  <g class="fall" style="animation-duration:10s;animation-delay:-1s"> <use xlink:href="#leaf" fill="#7cc08c" transform="scale(.6)"/></g></g>
  <g transform="translate(900 0)">  <g class="fall" style="animation-duration:15s;animation-delay:-11s"><use xlink:href="#leaf" fill="#e0b050" transform="scale(.45)"/></g></g>
  <g transform="translate(1060 0)"> <g class="fall" style="animation-duration:12s;animation-delay:-5s"> <use xlink:href="#leaf" fill="#a8d070" transform="scale(.55)"/></g></g>
  <g transform="translate(40 0)">   <g class="fall" style="animation-duration:13s;animation-delay:-8s"> <use xlink:href="#leaf" fill="#5aa876" transform="scale(.5)"/></g></g>

  <!-- title -->
  <g class="in" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="168" font-size="78" font-weight="800" fill="#1f4d36" letter-spacing="1">ResumeRooms</text>
    <path class="draw" d="M430 190 H770" pathLength="1" stroke="#6fb77f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="600" y="228" font-size="26" fill="#2f6b4c">Resume → Offer, room by room</text>
    <text x="600" y="266" font-size="17" fill="#4b7d62" letter-spacing="3">ATS LAB · SUGGESTIONS · STUDY · MOCK TEST</text>
  </g>
</svg>
