<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">The four ResumeRooms</title>
  <desc id="d">A winding trail connects four rooms: ATS Lab, Suggestion Room, Study Room and Mock Test Room. A small golden dot walks the trail.</desc>

  <style>
    .flow { stroke-dasharray: 10 10; animation: flow 1.6s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .ring { animation: none !important; }
    }
  </style>

  <rect x="2" y="2" width="1196" height="236" rx="22" fill="#f3faf0" stroke="#bfe0c8" stroke-width="2"/>

  <!-- trail -->
  <path id="trail" class="flow" fill="none" stroke="#7cc08c" stroke-width="4" stroke-linecap="round"
        d="M140 110 C240 30 340 190 440 110 C540 30 660 190 760 110 C860 30 960 190 1060 110"/>

  <!-- rooms -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(140 110)">
      <circle class="ring" r="30" fill="#6fb77f"/>
      <circle r="30" fill="#2b6b45"/>
      <text y="9" font-size="26" font-weight="700" fill="#ffffff">1</text>
      <text y="68" font-size="20" font-weight="700" fill="#1f4d36">ATS Lab</text>
      <text y="90" font-size="15" fill="#4b7d62">score</text>
    </g>

    <g transform="translate(440 110)">
      <circle class="ring" r="30" fill="#6fb77f" style="animation-delay:-.75s"/>
      <circle r="30" fill="#2b6b45"/>
      <text y="9" font-size="26" font-weight="700" fill="#ffffff">2</text>
      <text y="68" font-size="20" font-weight="700" fill="#1f4d36">Suggestions</text>
      <text y="90" font-size="15" fill="#4b7d62">fix</text>
    </g>

    <g transform="translate(760 110)">
      <circle class="ring" r="30" fill="#6fb77f" style="animation-delay:-1.5s"/>
      <circle r="30" fill="#2b6b45"/>
      <text y="9" font-size="26" font-weight="700" fill="#ffffff">3</text>
      <text y="68" font-size="20" font-weight="700" fill="#1f4d36">Study</text>
      <text y="90" font-size="15" fill="#4b7d62">learn</text>
    </g>

    <g transform="translate(1060 110)">
      <circle class="ring" r="30" fill="#6fb77f" style="animation-delay:-2.25s"/>
      <circle r="30" fill="#2b6b45"/>
      <text y="9" font-size="26" font-weight="700" fill="#ffffff">4</text>
      <text y="68" font-size="20" font-weight="700" fill="#1f4d36">Mock Test</text>
      <text y="90" font-size="15" fill="#4b7d62">practise</text>
    </g>
  </g>

  <!-- walker -->
  <circle r="8" fill="#f5b942" stroke="#ffffff" stroke-width="2">
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#trail"/>
    </animateMotion>
  </circle>
</svg>
